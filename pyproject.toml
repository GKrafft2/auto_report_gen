[project]
name = "auto-report-gen"
version = "0.1.0"
description = "Drafts annual report sections from last year's report and new project PDFs using GPT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bidict>=0.23.0",
    "docling>=2.63.0",
    "onnxruntime>=1.23.2",
    "openai>=2.8.1",
    "python-dotenv>=1.0.0",
    "pycountry>=24.6.1",
    "streamlit>=1.51.0",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
]


[tool.uv.sources]
torch = [
  { index = "pytorch-cu130"},
]
torchvision = [
  { index = "pytorch-cu130"},
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
]
